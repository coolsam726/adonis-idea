name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Test + buildPlugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regression guards (icons / EDT / @form / plugin.xml)
        run: python3 scripts/check-regression-guards.py
      - run: ./gradlew test koverVerify --no-daemon
      - run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: adonis-idea-zip
          path: build/distributions/*.zip
